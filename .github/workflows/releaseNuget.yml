name: Publish NuGet Package

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

jobs:
  publish:
    runs-on: windows-latest
    # id-token: write lets NuGet/login exchange a GitHub OIDC token for a temporary NuGet API key (trusted publishing)
    permissions:
      contents: read
      id-token: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7.0.1

    - name: Setup .NET
      uses: actions/setup-dotnet@v6.1.0
      with:
        dotnet-version: '11.x'

    - name: Replace <br> in README.md with two spaces for nuget.org
      run: |
        $content = Get-Content -Path README.md -Raw
        $content = $content -replace "<br>", "  "
        Set-Content -Path README.md -Value $content    


    - name: Build
      run: dotnet build --configuration Release

    - name: Check version consistency of git tag and CHANGELOG.md
      # needs in fsproj:
      # <Target Name="WriteChangelogVersion" AfterTargets="AfterBuild"> <!-- for version checks in github tag based builds -->
      #   <WriteLinesToFile File="./bin/ChangelogVersion.txt" Lines="@(CurrentReleaseChangelog)" Overwrite="true" ContinueOnError="false" />
      # </Target>
      id: check_version
      shell: bash
      run: |
        CHANGELOG_VERSION=$(cat ./Src/bin/ChangelogVersion.txt | tr -d '[:space:]')
        echo "CHANGELOG_VERSION=$CHANGELOG_VERSION"
        echo "github.ref_name=${{ github.ref_name }}"  
        if [ "${{ github.ref_name }}" != "$CHANGELOG_VERSION" ]; then
          echo "Version mismatch: git tag (${{ github.ref_name }}) and version in CHANGELOG.md ($CHANGELOG_VERSION) are not the same."
          exit 1
        fi        


    - name: NuGet login (trusted publishing, OIDC)
      # exchanges the GitHub OIDC token for a short-lived API key, see https://learn.microsoft.com/en-us/nuget/nuget-org/trusted-publishing
      # needs a trusted publishing policy on nuget.org for this repo and workflow file (releaseNuget.yml)
      uses: NuGet/login@v1.2.0
      id: nuget-login
      with:
        user: goswinr # nuget.org profile name (not email) of the policy owner

    - name: Publish NuGet package
      run: dotnet nuget push ./Src/bin/Release/AvalonLog.${{ github.ref_name}}.symbols.nupkg --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json